name: Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: fahadali268

          template: classic
          base: header, activity, community, repositories

          plugin_languages: yes
          plugin_languages_limit: 6

          plugin_habits: yes
          plugin_habits_days: 14

          plugin_activity: yes

          plugin_followup: yes
